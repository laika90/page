<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Keishiro Sakamoto</title>
  <meta name="description" content="Home page" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <div class="brand">
        <a href="index.html" class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-title">Keishiro Sakamoto</p>
          <p class="brand-subtitle"></p>
        </div>
        </a>
      </div>
      <nav class="nav">
        <a href="#posts">About</a>
        <button class="button" id="themeBtn" type="button">Theme</button>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-card">
        <h2>ようこそ</h2>
        <p>
            学んだことや考えたことについて備忘録として残していきます。
        </p>
        <!-- <div class="hero-actions"> -->
        <!--   <a class="button primary" href="#posts">記事を見る</a> -->
        <!--   <a class="button" href="#structure">構成を見る</a> -->
        <!-- </div> -->
      </div>
    </section>

    <section class="layout" id="posts">
      <aside class="sidebar">
        <h3>Search</h3>
        <input class="search" id="searchInput" type="search" placeholder="記事を検索" />
        <div style="height:12px"></div>
        <h3>Tags</h3>
        <div class="tree" style="padding:12px; background: var(--surface-2); border:1px solid var(--border); border-radius: var(--radius);">
          <ul class="tree-list" id="treeList"></ul>
        </div>
      </aside>

      <div>
        <div class="section-head">
          <div>
            <h3 id="currentDirTitle">All articles</h3>
            <p id="resultCount">0件</p>
          </div>
          <div class="meta" id="currentDirPath">/</div>
        </div>
        <div class="posts" id="postList"></div>
        <div class="pagination" id="pagination"></div>
      </div>
    </section>

    <footer>
      <div class="footer-inner">
        <div>© <span id="year"></span> Keishiro Sakamoto</div>
        <!-- <div></div> -->
      </div>
    </footer>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="assets/js/index.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
