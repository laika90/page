<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Notes</title>
  <meta name="description" content="GitHub Pages向けの、ディレクトリ構成で管理しやすいLaTeX対応サイト原型" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <div class="brand">
        <a href="index.html" class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-title">Keishiro Sakamoto</p>
          <!-- <p class="brand-subtitle">directory-based blog starter</p> -->
        </div>
        </a>
      </div>
      <nav class="nav">
        <a href="index.html#posts">記事</a>
        <a href="index.html#structure">構成</a>
        <a href="index.html#about">概要</a>
        <a class="button" id="themeBtn", type="button">Theme</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-card">
        <span class="eyebrow">Article</span>
        <h2 id="articleTitle">Loading...</h2>
        <p id="articleMeta" class="meta">記事を読み込んでいます。</p>
      </div>
    </section>

    <!-- <section class="layout" id="posts"> -->
    <section class="layout-post" id="posts">
      <!-- <aside class="sidebar"> -->
      <!-- </aside> -->

      <div>
        <article class="article active" id="articleView">
          <div id="articleBody">
          </div>
        </article>

      </div>
    </section>

    <footer>
      <div class="footer-inner">
        <div>© <span id="year"></span> My Notes</div>
        <div>GitHub Pages • MathJax • Directory-based organization</div>
      </div>
    </footer>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="assets/js/post.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
