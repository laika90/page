<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Notes</title>
  <meta name="description" content="GitHub Pages向けの、ディレクトリ構成で管理しやすいLaTeX対応サイト原型" />
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    (function () {
      const saved = localStorage.getItem('theme');
      const systemDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      document.documentElement.dataset.theme = saved || (systemDark ? 'dark' : 'light');
    })();
  </script>
</head>
<body>
  <header class="header">
    <div class="wrap header-inner">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div>
          <p class="brand-title">My Notes</p>
          <p class="brand-subtitle">directory-based blog starter</p>
        </div>
      </div>
      <nav class="nav">
        <a href="index.html#posts">記事</a>
        <a href="index.html#structure">構成</a>
        <a href="index.html#about">概要</a>
        <a class="button" href="index.html">Back</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section class="hero">
      <div class="hero-card">
        <span class="eyebrow">Article</span>
        <h2 id="articleTitle">Loading...</h2>
        <p id="articleMeta" class="meta">記事を読み込んでいます。</p>
      </div>
    </section>

    <section class="layout" id="posts">
      <aside class="sidebar">
        <h3>Navigation</h3>
        <div class="stack">
          <a class="button" href="index.html#posts">記事一覧へ戻る</a>
          <a class="button" href="index.html#structure">構成を見る</a>
          <a class="button" href="index.html#about">概要を見る</a>
        </div>

        <div style="height:12px"></div>

        <h3>Theme</h3>
        <button class="button" id="themeBtn" type="button">Theme</button>
      </aside>

      <div>
        <article class="article active" id="articleView">
          <div id="articleBody">
            <p>読み込み中...</p>
          </div>
        </article>

        <section class="panel">
          <h3>この記事について</h3>
          <p class="meta">
            Markdown ファイルから読み込んだ本文がここに表示されます。数式は MathJax でレンダリングされます。
          </p>
        </section>
      </div>
    </section>

    <footer>
      <div class="footer-inner">
        <div>© <span id="year"></span> My Notes</div>
        <div>GitHub Pages • MathJax • Directory-based organization</div>
      </div>
    </footer>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script defer src="assets/js/post.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
</body>
</html>
